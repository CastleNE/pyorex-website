name: PyOrex HUB intelligence tests

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/hub-*.js'
      - 'functions/api/hub/collect.js'
      - 'tests/hub-intelligence.test.mjs'
      - '.github/workflows/hub-ci.yml'
  pull_request:
    paths:
      - 'src/lib/hub-*.js'
      - 'functions/api/hub/collect.js'
      - 'tests/hub-intelligence.test.mjs'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: |
          node --check functions/api/hub/collect.js
          node --check src/lib/hub-materiality.js
          node --check src/lib/hub-source-links.js
      - name: Run intelligence tests
        run: node --test tests/hub-intelligence.test.mjs
